<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Road Trip Map</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧭</text></svg>">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Logan's Road Trip">
<meta property="og:title" content="Logan's Road Trip — Map">
<meta property="og:description" content="Follow the route stop by stop: where we are right now, the road already driven, and what's still ahead.">
<meta property="og:url" content="https://loganbrose.github.io/Road_Trip/">
<meta property="og:image" content="https://loganbrose.github.io/Road_Trip/assets/og-cover.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Logan's Road Trip — Map">
<meta name="twitter:description" content="Follow the route stop by stop: where we are right now, the road already driven, and what's still ahead.">
<meta name="twitter:image" content="https://loganbrose.github.io/Road_Trip/assets/og-cover.png">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="css/style.css?v=19">
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <a class="site-title" href="index.html">🧭 <span id="trip-name">Road Trip</span></a>
    <nav class="main-nav">
      <a class="nav-link" href="index.html">Map</a>
      <a class="nav-link" href="itinerary.html">Itinerary</a>
      <a class="nav-link" href="spending.html">Spending</a>
      <a class="nav-link" href="gallery.html">Photos</a>
    </nav>
  </div>
</header>

<main>
  <h1 id="trip-name-heading">Road Trip</h1>

  <div class="now-strip" id="now-strip" hidden>
    <div class="now-text" id="now-text"></div>
    <div class="now-progress">
      <div class="budget-bar-track"><div class="budget-bar-fill" id="now-progress-fill" style="width:0%"></div></div>
      <div class="now-progress-label" id="now-progress-label"></div>
    </div>
  </div>

  <div class="stat-strip" id="stat-strip">
    <div class="stat-box"><div class="num" id="stat-visited">–</div><div class="label">Stops visited</div></div>
    <div class="stat-box"><div class="num" id="stat-remaining">–</div><div class="label">Stops planned</div></div>
    <div class="stat-box"><div class="num" id="stat-nights">–</div><div class="label">Nights so far</div></div>
    <div class="stat-box"><div class="num" id="stat-miles">–</div><div class="label">Miles driven</div></div>
    <div class="stat-box"><div class="num" id="stat-states">–</div><div class="label">States visited</div></div>
  </div>

  <div class="legend">
    <span><span class="dot" style="background:var(--visited)"></span>Visited</span>
    <span><span class="dot" style="background:var(--current)"></span>Current</span>
    <span><span class="dot" style="background:var(--planned)"></span>Planned</span>
    <span><span class="dot" style="background:var(--skipped)"></span>Skipped</span>
    <span><span class="line driven"></span>Driven</span>
    <span><span class="line ahead"></span>Road ahead</span>
  </div>

  <div class="map-layout">
    <div id="map"></div>
    <aside class="card ranking-panel">
      <h2 style="margin-top:0;">Top Rated Stops</h2>
      <ol class="ranking-list" id="ranking-list"></ol>
      <div class="empty-state" id="ranking-empty" hidden>No rated stops yet.</div>
    </aside>
  </div>
  <p id="debug-line" hidden style="color:var(--text-muted);font-size:0.78rem;margin-top:8px;"></p>
</main>


<script src="vendor/leaflet/leaflet.js"></script>
<script src="vendor/papaparse.min.js"></script>
<script src="js/config.js?v=19"></script>
<script src="js/data.js?v=19"></script>
<script src="js/route.js?v=19"></script>
<script src="js/playback.js?v=19"></script>
<script src="js/map.js?v=19"></script>
</body>
</html>
